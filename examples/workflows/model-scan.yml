# Copy to .github/workflows/model-scan.yml in your repo.
name: Model retirement scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"      # every Monday, so new deprecations surface even without code changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ModelMigrate free scan
        id: btm
        # TODO: replace with the published repo, pinned to a tag or commit SHA
        uses: burntandtoast/modelmigrate@v0
        with:
          fail-on-high: "true"
          # packs: "openai,anthropic"
      - run: echo "Found ${{ steps.btm.outputs.total }} references, ${{ steps.btm.outputs.high }} high risk"
