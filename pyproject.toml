[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bt-migration-kit"
version = "0.1.0"
description = "Burnt & Toast Studios OpenAI API migration kit (scan, swap, eval, report)"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bt-migrate = "migration_kit.cli:main"

[tool.setuptools]
packages = ["migration_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
