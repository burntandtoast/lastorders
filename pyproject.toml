[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lastorders"
dynamic = ["version"]
description = "Free scanner for retiring AI model IDs (OpenAI, Anthropic, ...) in your code, with CI support."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Burnt & Toast Studios" }]
keywords = ["openai", "anthropic", "llm", "deprecation", "migration", "gpt-4o", "scanner", "github-action"]
# MIT covers the free scan, packs, CLI and licence client. LicenseRef-Commercial covers
# migration_kit/swapper.py, fixer/, evaluator.py, initevals.py and report.py
# (see LICENSE-COMMERCIAL).
license = "MIT AND LicenseRef-Commercial"
license-files = ["LICENSE", "LICENSE-COMMERCIAL"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6", "jsonschema>=4", "libcst>=1.1", "cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
lastorders = "migration_kit.cli:main"

[project.urls]
# TODO: set once the repo / site exist
Homepage = "https://burntandtoast.com"

[tool.setuptools]
packages = ["migration_kit", "migration_kit.pack_data", "migration_kit.fixer"]

[tool.setuptools.dynamic]
version = { attr = "migration_kit.__version__" }

[tool.setuptools.package-data]
"migration_kit.pack_data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
