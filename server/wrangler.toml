# Last Orders licence server + pack site. Nothing here is secret; secrets go in `wrangler secret put` (see docs/LICENCE-SERVER.md).
name = "lastorders-licence"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
routes = [{ pattern = "packs.burntandtoast.com", custom_domain = true }]

# Workers Logs (console output kept for a few days; needed to see webhook/email failures).
[observability]
enabled = true

# Serve the static pack site (packs/v1/*.json, index) from the same Worker; API routes run first.
[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = ["/api/*", "/buy", "/success", "/cancel", "/terms", "/healthz"]

[[d1_databases]]
binding = "DB"
database_name = "lastorders-licences"
database_id = "4c630040-81cd-4e1c-ab2f-a05bf08b424e"      # from `wrangler d1 create lastorders-licences`
migrations_dir = "migrations"


[vars]
PRODUCT_NAME = "Last Orders"
CLI_NAME = "lastorders"
PRODUCT_CODE = "lastorders-repo"
CURRENCY = "gbp"
PRICE_AMOUNT = "14900"            # minor units (14900 = £149.00). Ignored if STRIPE_PRICE_ID is set.
STRIPE_PRICE_ID = ""              # optional: a Price from the Stripe Dashboard instead of inline price_data. With MANAGED_PAYMENTS, that product needs tax code txcd_10202003 and the price needs tax_behavior=inclusive (see scripts/ensure-product.mjs).
ALLOW_PROMOTION_CODES = "false"
STRIPE_AUTOMATIC_TAX = "false"    # set "true" once Stripe Tax is set up (UK VAT). Ignored while MANAGED_PAYMENTS is "1" (Link calculates tax).
STRIPE_TOS_CONSENT = "false"     # "true" once a Terms URL is set in Stripe Dashboard → Settings → Public details
STRIPE_INVOICE_CREATION = "false" # "true" emails a Stripe invoice (useful for B2B buyers). Ignored while MANAGED_PAYMENTS is "1" (Link sends receipts).
MANAGED_PAYMENTS = "1"            # "1": Link is merchant of record. Checkout sends managed_payments[enabled]=true and Stripe-Version 2025-03-31.basil (or STRIPE_API_VERSION if that date is later). "0" is ordinary Stripe Checkout.
TOKEN_TTL_DAYS = "7"
LICENCE_FEATURES = "*"
EMAIL_PROVIDER = "resend"         # resend | log | none
EMAIL_FROM = "Last Orders <licences@burntandtoast.com>"
EMAIL_REPLY_TO = ""
SUPPORT_EMAIL = ""
PUBLIC_BASE_URL = "https://packs.burntandtoast.com"  # CLI/API host (verify, packs, webhook); defaults to the request origin
PUBLIC_SITE_URL = "https://lastorders.burntandtoast.com"  # customer-facing: /buy, /terms, /success, /cancel (served via the landing Worker); old links on the API host 301 here

# Secrets (never in this file):
#   STRIPE_SECRET_KEY      sk_test_... (later sk_live_... or a restricted rk_ key)
#   STRIPE_WEBHOOK_SECRET  whsec_... (comma-separate two while rolling)
#   RESEND_API_KEY         re_...
#   LICENCE_SIGNING_KEY    JSON from `npm run keys`
#   ADMIN_TOKEN            long random string (>= 24 chars)
