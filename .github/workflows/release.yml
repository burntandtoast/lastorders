# Release to PyPI with Trusted Publishing (OIDC): no PyPI API token exists anywhere.
# Setup (once): see docs/PUBLISHING.md section 3.
#   push a tag vX.Y.Z  -> test, build, publish to TestPyPI, then PyPI (after approval on the `pypi` environment)
#   "Run workflow"     -> test, build, publish to TestPyPI only (a dry run of the pipeline)
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Tag must match migration_kit.__version__
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python -c "import migration_kit; print(migration_kit.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - name: Licence public key must be embedded
        if: startsWith(github.ref, 'refs/tags/')
        # Block scalar: ": " in the message is a YAML mapping separator in a plain scalar, so GitHub rejects the file.
        run: |
          python -c "from migration_kit import licence; assert licence.PUBLIC_KEYS, 'PUBLIC_KEYS is empty: run npm run keys (docs/LICENCE-SERVER.md)'"
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/lastorders
    permissions:
      id-token: write          # OIDC token for Trusted Publishing; the only credential used
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi                # require a manual approval on this environment
      url: https://pypi.org/p/lastorders
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
