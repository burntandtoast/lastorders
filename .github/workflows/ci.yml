name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: modelmigrate packs validate migration_kit/pack_data/*.json
  action-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: btm
        uses: ./
        with:
          path: examples/sample-app
          offline: "true"
          fix-preview: "true"
      - name: Expect findings in the sample repo
        run: test "${{ steps.btm.outputs.high }}" -gt 0
